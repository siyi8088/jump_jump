<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG 海报款 3D 纸飞机预览台 (带厚度实体版)</title>
    <style>
        body { margin: 0; background-color: #050A1F; overflow: hidden; color: white; font-family: sans-serif; }
        #info { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.8); letter-spacing: 1px; }
        .kbd { background: #1E293B; padding: 4px 8px; border-radius: 4px; border: 1px solid #334155; font-family: monospace; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">
        🖱️ <span class="kbd">左键</span> 拖拽旋转视角 | <span class="kbd">滚轮</span> 缩放 | 终极带厚度版！
    </div>
    
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050A1F, 0.05); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 5); 
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 打光：增强对比度，突出折痕
        scene.add(new THREE.AmbientLight(0x112244, 2.0)); 
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5); 
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const planeGroup = new THREE.Group();

        // ==========================================
        // ✨ 带厚度的实体模型：12顶点 封闭几何体 ✨
        // ==========================================
        const geo = new THREE.BufferGeometry();
        const s = 1.0; 
        const t = 0.06; // 👈 这里是厚度！你可以随时改它 (例如改成 0.1 变得更厚)

        // 12个顶点：上层 6 个 (你精心调整的) + 下层 6 个
        const vertices = new Float32Array([
           // --- 上层表面 (Top Layer) ---
           0.0,       0.0,      -1.0 * s, // 0: 机头
          -0.95 * s,  0.15 * s,   1.3 * s, // 1: 左翼尖 
           0.95 * s,  0.15 * s,   1.3 * s, // 2: 右翼尖 
          -0.21 * s,   0.2 * s,   1.0 * s, // 3: 左机背折痕 
           0.21 * s,   0.2 * s,   1.0 * s, // 4: 右机背折痕 
           0.0,      -0.4 * s,   1.0 * s, // 5: 底部深龙骨 

           // --- 下层表面 (Bottom Layer) 向下平移 t ---
           0.0,       0.0 - t,  -1.0 * s, // 6: 底机头
          -0.95 * s,  0.15 - t,   1.3 * s, // 7: 底左翼尖
           0.95 * s,  0.15 - t,   1.3 * s, // 8: 底右翼尖
          -0.21 * s,   0.2 - t,   1.0 * s, // 9: 底左机背
           0.21 * s,   0.2 - t,   1.0 * s, // 10:底右机背
           0.0,      -0.4 - t,   1.0 * s, // 11:底龙骨
        ]);

        // 完美缝合的 20 个三角面 (组成一个封闭外壳)
        const indices = [
          // --- 上表面 ---
          0, 1, 3, 
          0, 4, 2, 
          0, 3, 5, 
          0, 5, 4,
          
          // --- 下表面 (反向缠绕，法线朝外) ---
          6, 9, 7,   
          6, 8, 10,  
          6, 11, 9,  
          6, 10, 11,
          
          // --- 侧面四周封边 (完美缝合上下层) ---
          // 右前边缘 (0->2)
          0, 6, 8,   0, 8, 2,
          // 右后翼边缘 (2->4)
          2, 8, 10,  2, 10, 4,
          // 右机腹边缘 (4->5)
          4, 10, 11, 4, 11, 5,
          // 左机腹边缘 (5->3)
          5, 11, 9,  5, 9, 3,
          // 左后翼边缘 (3->1)
          3, 9, 7,   3, 7, 1,
          // 左前边缘 (1->0)
          1, 7, 6,   1, 6, 0
        ];

        geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        geo.setIndex(indices);
        geo.computeVertexNormals();

        // 海报级材质
        const mat = new THREE.MeshStandardMaterial({
          color: 0x1c6fa3,        
          emissive: 0x0055AA,     
          emissiveIntensity: 0.6,
          roughness: 0.2, 
          metalness: 0.2,
          flatShading: true,      
          side: THREE.DoubleSide
        });

        const airplane = new THREE.Mesh(geo, mat);

        // 赛博朋克青色霓虹发光边
        const edges = new THREE.EdgesGeometry(geo);
        const lineMat = new THREE.LineBasicMaterial({ 
            color: 0x44FFFF,      
            transparent: true, 
            opacity: 1.0
        });
        airplane.add(new THREE.LineSegments(edges, lineMat));

        planeGroup.add(airplane);
        scene.add(planeGroup);
        // ==========================================

        const gridHelper = new THREE.GridHelper(20, 20, 0x00d2ff, 0x002244);
        gridHelper.position.y = -1.5;
        scene.add(gridHelper);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            
            const time = clock.getElapsedTime();
            planeGroup.rotation.y = time * 0.4; 
            planeGroup.position.y = Math.sin(time * 2) * 0.1;
            
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
