services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    container_name: jump-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jumpjump
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Backend API ───
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: jump-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/jumpjump
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: https://${DOMAIN}
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  pgdata:
